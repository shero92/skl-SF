name: Verified Long-Goal Completion Notice
on:
  push:
    branches: [main]
    paths:
      - ".agents/planner/goals.json"
      - ".agents/tasks/**"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub issue only after verified goal completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 tools/goal_task_factory.py completed > /tmp/completed-goals.json
          python3 -c 'import json;print("\n".join(x["id"]+"\t"+x["title"] for x in json.load(open("/tmp/completed-goals.json"))))' |
          while IFS=$'\t' read -r goal title; do
            [ -n "$goal" ] || continue
            label="[Goal complete] $goal"
            if ! gh issue list --state all --limit 1000 --json title --jq '.[].title' | grep -Fxq "$label"; then
              gh issue create --title "$label" --assignee shero92 \
                --body "Verified in main: $title. Every linked task is done with PR evidence, and final_verified=true."
            fi
          done
