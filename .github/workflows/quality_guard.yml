name: Prevent art quality regressions
on:
  push:
    paths:
      - "map_factory/parts/**/*.png"
      - "map_factory/metadata/asset_index.json"
      - "tools/quality_guard.py"
      - ".github/workflows/quality_guard.yml"
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PNG reader
        run: python -m pip install "Pillow>=10,<13"
      - name: Enforce stable assets and stop unreviewed loss of detail
        run: python tools/quality_guard.py
