name: Keep higher-detail stone art
on:
  push:
    paths:
      - "tools/restore_high_detail_floors.py"
      - ".github/workflows/restore_high_detail_floors.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore four source-detailed floor parts
        run: python tools/restore_high_detail_floors.py
      - name: Validate room IDs
        run: python tools/validate_rooms.py
      - name: Commit selective quality preservation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts/floors map_factory/metadata/asset_index.json map_factory/metadata/production_queue.csv docs/FLOOR_REPAINT_QA.md
          if ! git diff --cached --quiet; then
            git commit -m "Retain four high-detail original sandstone sprites over lower-detail alternatives"
            git push
          fi
