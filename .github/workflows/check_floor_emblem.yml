name: Verify nautical compass block art
on:
  push:
    paths:
      - "tools/check_floor_emblem.py"
      - ".github/workflows/check_floor_emblem.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: python tools/check_floor_emblem.py
      - uses: actions/upload-artifact@v4
        with:
          name: compass-source-nine-tile-test
          path: docs/previews/map_factory_renders/compass_source_3x3.png
      - name: Commit source tile quality evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/map_factory_renders/compass_source_3x3.png
          if ! git diff --cached --quiet; then
            git commit -m "Document raw registered gold and blue compass block image"
            git push
          fi
