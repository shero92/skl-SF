name: Validate Godot project
on:
  push:
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.json"
      - "project.godot"
      - ".github/workflows/godot_validate.yml"
  workflow_dispatch:
jobs:
  import_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.4.1 Linux editor
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Godot headless resource import and script parse
        run: /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Godot headless smoke test
        run: /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 45
