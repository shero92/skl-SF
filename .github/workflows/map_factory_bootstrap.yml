name: Map factory bootstrap
on:
  push:
    paths:
      - "tools/map_factory_cli.py"
      - ".github/workflows/map_factory_bootstrap.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Establish version-one Hero Room map-only baseline
        run: |
          if [ ! -e map_factory/maps/index.json ]; then
            python tools/map_factory_cli.py bootstrap --map-id hero_room_01 --source map_factory/rooms/hero_room.json
          fi
      - name: Run map factory unit tests
        run: python -m unittest discover -s tools/tests -p 'test_map_factory.py' -v
      - name: Validate map registry and all immutable snapshots
        run: python tools/map_factory_cli.py validate
      - name: Commit baseline map snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/maps
          if ! git diff --cached --quiet; then
            git commit -m "Initialize immutable map-only Hero Room v0001 and latest registry"
            git push
          fi
