name: Verify project navigation indexes
on:
  pull_request:
  # main is verified after "Regenerate main-only outputs" refreshed the generated files (ADR-006), so the
  # strict check sees the real state instead of the stale merge commit; it runs even if regeneration failed.
  workflow_run:
    workflows: ["Regenerate main-only outputs"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - name: Verify directory listings are synchronized
        if: github.event_name != 'pull_request'
        run: python3 tools/generate_project_indexes.py --check
      - name: Validate pull request sources without changing generated outputs
        if: github.event_name == 'pull_request'
        run: python3 tools/generate_project_indexes.py --sources-only --base origin/main
      - name: Verify tools/tests/INDEX.md matches the test router map
        if: github.event_name != 'pull_request'
        run: python3 tools/run_tests.py --check-index
      - name: Validate the test router map without changing its generated index
        if: github.event_name == 'pull_request'
        run: python3 tools/run_tests.py --check-index --sources-only
      - name: Test deterministic index generation
        run: python3 -m unittest discover -s tools/tests -p 'test_project_indexes.py' -v
