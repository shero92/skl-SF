name: Verify multi-agent task and graphics handoffs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracking records and generated dashboards
        run: python3 tools/agent_workflow.py --check
      - name: Verify code/graphics boundary and deduplication rules
        run: python3 -m unittest discover -s tools/tests -p 'test_agent_workflow.py' -v
      - name: Verify goal planner, prompt and claim safeguards
        run: python3 -m unittest discover -s tools/tests -p 'test_goal_task_factory.py' -v
      - name: Ensure Claude and Codex planner skills are byte-identical
        run: cmp -s .claude/skills/goal-task-factory/SKILL.md .agents/skills/goal-task-factory/SKILL.md
      - name: Validate local-only planning proposals and setup defaults
        run: python3 -m unittest discover -s tools/tests -p 'test_local_planner.py' -v
      - name: Verify safe direct-merge guardrails
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_parallel_safety.py' -v
          python3 -m py_compile tools/agent_runner.py tools/runner_safety.py tools/art_delivery.py tools/goal_costs.py
