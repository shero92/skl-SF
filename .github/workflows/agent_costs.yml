name: Verify agent cost receipts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check aggregated receipts
        if: github.event_name != 'pull_request'
        run: python3 tools/agent_costs.py report --check
      - name: Validate pull request sources without changing generated outputs
        if: github.event_name == 'pull_request'
        run: python3 tools/agent_costs.py report --sources-only --base origin/main
      - name: Test Claude and Codex accounting
        run: python3 -m unittest discover -s tools/tests -p 'test_agent_costs.py' -v
