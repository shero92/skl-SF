name: Verify agent cost receipts
on:
  pull_request:
  # main is verified after "Regenerate main-only outputs" refreshed the generated files (ADR-006), so the
  # strict check sees the real state instead of the stale merge commit; it runs even if regeneration failed.
  workflow_run:
    workflows: ["Regenerate main-only outputs"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - name: Check aggregated receipts
        if: github.event_name != 'pull_request'
        run: python3 tools/agent_costs.py report --check
      - name: Validate pull request sources without changing generated outputs
        if: github.event_name == 'pull_request'
        run: python3 tools/agent_costs.py report --sources-only --base origin/main
      - name: Test Claude and Codex accounting
        run: python3 -m unittest discover -s tools/tests -p 'test_agent_costs.py' -v
