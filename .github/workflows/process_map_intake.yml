name: Build versioned maps from AI room manifests
on:
  push:
    paths:
      - "map_factory/intake/pending/*.json"
      - "map_factory/intake/assets/**/*.png"
      - "map_factory/references/**"
      - "tools/process_map_intake.py"
      - "tools/map_factory_layers.py"
      - "tools/map_factory_cli.py"
      - "tools/tests/test_map_layers.py"
      - "tools/import_map_assets.py"
      - ".github/workflows/process_map_intake.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-factory-intake-main
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PNG validator
        run: python -m pip install "Pillow>=10,<13"
      - name: Apply only new AI maps and approved block manifests
        run: python tools/process_map_intake.py
      - name: Refresh read-only block indices and five-pass layer metadata
        run: python tools/map_factory_cli.py sync-blocks
      - name: Validate all immutable map versions
        run: python tools/map_factory_cli.py validate
      - name: Run tests
        run: python -m unittest discover -s tools/tests -p 'test_map*.py' -v
      - name: Read-only verification of map PNG assets (not characters/UI)
        run: python tools/verify_map_assets.py
      - name: Commit generated map versions, reused blocks and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A map_factory
          if ! git diff --cached --quiet; then
            git commit -m "Compile AI room changes against the last version and sync reusable blocks"
            git fetch origin main
            git rebase origin/main
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
              git fetch origin main
              git rebase origin/main
            done
            echo "Map intake commit could not be pushed after 5 retries"
            exit 1
          fi
