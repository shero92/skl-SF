name: Build versioned maps from AI room manifests
on:
  push:
    paths:
      - "map_factory/intake/pending/*.json"
      - "map_factory/intake/assets/**/*.png"
      - "map_factory/references/**"
      - "tools/process_map_intake.py"
      - "tools/import_map_assets.py"
      - ".github/workflows/process_map_intake.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: map-factory-intake-main
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PNG validator
        run: python -m pip install "Pillow>=10,<13"
      - name: Apply only new AI maps and approved block manifests
        run: python tools/process_map_intake.py
      - name: Validate all immutable map versions
        run: python tools/map_factory_cli.py validate
      - name: Run tests
        run: python -m unittest discover -s tools/tests -p 'test_map_factory.py' -v
      - name: Verify complete PNG catalog
        run: python tools/audit_assets.py
      - name: Commit generated map versions, reused blocks and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/maps map_factory/intake/processed map_factory/parts map_factory/candidates map_factory/metadata
          if ! git diff --cached --quiet; then
            git commit -m "Compile AI room changes against the last version and sync reusable blocks"
            git push
          fi
