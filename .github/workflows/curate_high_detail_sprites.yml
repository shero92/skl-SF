name: Curate five high-detail prop sprites
on:
  push:
    paths:
      - "tools/curate_high_detail_sprites.py"
      - ".github/workflows/curate_high_detail_sprites.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Crop unrelated atlas fragments only
        run: python tools/curate_high_detail_sprites.py
      - name: Audit image integrity
        run: python tools/audit_assets.py
      - name: Update review galleries
        run: python tools/build_asset_previews.py
      - name: Commit verified cutouts and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts/walls/W001_*.png map_factory/parts/objects/O001_*.png map_factory/parts/furniture/P011_*.png map_factory/parts/furniture/P014_*.png map_factory/parts/furniture/P015_*.png map_factory/metadata/asset_index.json map_factory/metadata/production_queue.csv map_factory/metadata/asset_audit.json docs/ART_QUALITY_REVIEW.md docs/ASSET_GALLERY.md docs/previews
          if ! git diff --cached --quiet; then
            git commit -m "Remove unwanted neighbor crops in five high-detail reusable sprites"
            git push
          fi
