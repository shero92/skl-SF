name: Generate modular art details
on:
  push:
    paths:
      - "tools/generate_missing_details.py"
      - ".github/workflows/generate_missing_details.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Derive reusable architecture, banner and light effects
        run: python tools/generate_missing_details.py
      - name: Run art integrity audit
        run: python tools/audit_assets.py
      - name: Build per-category QA galleries
        run: python tools/build_asset_previews.py
      - name: Commit independent PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts map_factory/metadata docs/ASSET_AUDIT.md docs/ASSET_GALLERY.md docs/previews
          if ! git diff --cached --quiet; then
            git commit -m "Produce 12 reusable ruins and lighting detail PNGs"
            git push
          fi
