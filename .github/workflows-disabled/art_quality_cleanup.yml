name: Audit and clean atlas crop debris
on:
  push:
    paths:
      - "tools/quality_review_and_cleanup.py"
      - ".github/workflows/art_quality_cleanup.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup image analysis
        run: python -m pip install "Pillow>=10,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Audit all 218 sprite files and safely remove identified crop leftovers
        run: python tools/quality_review_and_cleanup.py
      - name: Recheck all images and metadata
        run: python tools/audit_assets.py
      - name: Check room JSON references
        run: python tools/validate_rooms.py
      - name: Commit improved independent PNGs and quality evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts map_factory/metadata docs/ART_QUALITY_REVIEW.md docs/previews/verified_cutout_cleanup.png docs/ASSET_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "Clean 23 inspected sprite cutouts and record full asset quality QA"
            git push
          fi
