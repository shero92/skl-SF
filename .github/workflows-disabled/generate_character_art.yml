name: Generate Character Art

on:
  push:
    paths:
      - "tools/generate_character_art.py"
      - ".github/workflows/generate_character_art.yml"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup art tooling
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate 12 sprite animation strips and two portraits
        run: python tools/generate_character_art.py
      - name: Audit all generated artwork
        run: python tools/audit_assets.py
      - name: Generate visual QA previews
        run: python tools/build_asset_previews.py
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts/characters map_factory/parts/ui map_factory/metadata docs/previews docs/ASSET_GALLERY.md docs/ASSET_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "Generate 12 reusable character sprites and two portraits"
            git push
          fi
