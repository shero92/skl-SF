name: Repaint JRPG interface frames
on:
  push:
    paths:
      - "tools/repaint_dialogue_ui.py"
      - ".github/workflows/repaint_dialogue_ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Repaint ornate user interface assets
        run: python tools/repaint_dialogue_ui.py
      - name: Rebuild review gallery
        run: python tools/build_asset_previews.py
      - name: Save revised interface textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts/ui map_factory/metadata/asset_index.json map_factory/metadata/production_queue.csv docs/previews/ornate_dialogue_ui_review.png docs/ASSET_GALLERY.md docs/previews/ui.png
          if ! git diff --cached --quiet; then
            git commit -m "Repaint 5 ornate navy-gold JRPG UI sprites without changing dimensions"
            git push
          fi
