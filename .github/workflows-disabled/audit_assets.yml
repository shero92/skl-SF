name: Audit Game Asset Quality
on:
  push:
    paths:
      - "map_factory/parts/**/*.png"
      - "map_factory/metadata/asset_index.json"
      - "tools/audit_assets.py"
      - ".github/workflows/audit_assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Verify PNGs and update inventory
        run: python tools/audit_assets.py
      - name: Commit audit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/metadata/asset_index.json map_factory/metadata/asset_audit.json map_factory/metadata/production_queue.csv docs/ASSET_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "Verify PNG inventory and flag unreviewed assets"
            git push
          fi
