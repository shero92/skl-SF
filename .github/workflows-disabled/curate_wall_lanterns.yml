name: Curate lantern sprite cutouts
on:
  push:
    paths:
      - "tools/curate_wall_lanterns.py"
      - ".github/workflows/curate_wall_lanterns.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Correct left and right wall lantern transparency crops
        run: python tools/curate_wall_lanterns.py
      - name: Audit all file dimensions and alpha
        run: python tools/audit_assets.py
      - name: Refresh asset review gallery
        run: python tools/build_asset_previews.py
      - name: Commit only verified lantern cutouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map_factory/parts/decor/D008_*.png map_factory/parts/decor/D009_*.png map_factory/metadata/asset_index.json map_factory/metadata/production_queue.csv map_factory/metadata/asset_audit.json docs/ART_QUALITY_REVIEW.md docs/ASSET_GALLERY.md docs/previews/decor.png
          if ! git diff --cached --quiet; then
            git commit -m "Clean wall lantern sprite crops and update origins without reducing detail"
            git push
          fi
